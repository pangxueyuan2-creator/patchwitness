version = 1
id = "patchwitness-self-check"
goal = "Keep PatchWitness releasable, tested, and within a reviewable change budget"

[policy]
allowed_paths = ["**"]
denied_paths = [".git/**", ".patchwitness/evidence/**"]
protected_paths = [
  ".github/workflows/**",
  ".patchwitness.toml",
  ".patchwitness/contracts/**",
]
max_files = 120
max_lines = 12000
allow_binary = false
allow_dependency_changes = false
require_tests = true

[[checks]]
id = "tests"
command = "python -m pytest -q"
required = true
timeout_seconds = 300

[[checks]]
id = "lint"
command = "ruff check src tests"
required = true
timeout_seconds = 120

[[checks]]
id = "types"
command = "mypy src"
required = true
timeout_seconds = 120

