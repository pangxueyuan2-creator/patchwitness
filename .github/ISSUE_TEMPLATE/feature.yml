name: Feature request
description: Propose a focused trust, evidence, or integration improvement
title: "[Feature]: "
labels: [enhancement, triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What real workflow is blocked or unreliable today?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Desired evidence or behavior
      description: What independently verifiable fact should PatchWitness produce?
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Best extension surface
      options: [Core rule, Analyzer plugin, Reporter, SDK, MCP, CI integration, Unsure]
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Existing alternatives
      description: What tools or workarounds have you tried?

