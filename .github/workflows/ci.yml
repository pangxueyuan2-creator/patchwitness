name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.14"
          - os: windows-latest
            python: "3.13"
          - os: macos-latest
            python: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Tests
        run: python -m pytest --cov=patchwitness --cov-report=term-missing --cov-report=xml --cov-fail-under=80
      - name: Ruff
        run: ruff check src tests
      - name: Mypy
        run: mypy src
      - name: CLI smoke
        run: |
          patchwitness --version
          patchwitness doctor
          patchwitness benchmark --files 50 --rounds 1
      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.14'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage
          path: coverage.xml

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - run: python -m pip install --disable-pip-version-check build
      - run: python -m build
      - name: Wheel smoke test
        run: |
          python -m venv /tmp/patchwitness-wheel
          /tmp/patchwitness-wheel/bin/pip install dist/*.whl
          /tmp/patchwitness-wheel/bin/patchwitness --version
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: distributions
          path: dist/*

  tasktopr-integration:
    runs-on: ubuntu-latest
    env:
      TASKTOPR_REVISION: 237bdc174f46d24ff6f10a3331f2b47e68535b4c
    steps:
      - name: Checkout PatchWitness candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Checkout reviewed TaskToPR producer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: pangxueyuan2-creator/tasktopr
          ref: ${{ env.TASKTOPR_REVISION }}
          path: _integration/tasktopr
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: Build both reviewed products
        run: |
          python -m pip install --disable-pip-version-check build
          python -m build --wheel --outdir dist
          python -m build --wheel --outdir _integration/tasktopr-dist _integration/tasktopr
      - name: Run installed two-product Safe Delivery smoke
        run: |
          python -m venv /tmp/patchwitness-tasktopr
          /tmp/patchwitness-tasktopr/bin/pip install --no-deps dist/*.whl _integration/tasktopr-dist/*.whl
          /tmp/patchwitness-tasktopr/bin/python scripts/tasktopr_safe_delivery_smoke.py "$TASKTOPR_REVISION"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build image
        run: docker build -t patchwitness:ci .
      - name: Container smoke test
        run: docker run --rm patchwitness:ci --version
