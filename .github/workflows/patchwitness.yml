name: PatchWitness

on:
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: Install project and quality tools
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Gate against authoritative base policy
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set +e
          patchwitness gate \
            --base "$BASE_SHA" \
            --policy-ref "$BASE_SHA" \
            --clean-room \
            --output .patchwitness/evidence/pr.json
          code=$?
          patchwitness report .patchwitness/evidence/pr.json --format markdown >> "$GITHUB_STEP_SUMMARY"
          patchwitness report .patchwitness/evidence/pr.json --format github
          exit $code
