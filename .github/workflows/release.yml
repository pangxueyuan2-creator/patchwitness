name: Release assets

on:
  release:
    types: [published]

permissions:
  attestations: write
  contents: write
  id-token: write

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - run: python -m pip install --disable-pip-version-check build
      - name: Verify tag matches package version
        shell: bash
        run: |
          version=$(python -c "import runpy; print(runpy.run_path('src/patchwitness/_version.py')['__version__'])")
          test "v${version}" = "${{ github.event.release.tag_name }}"
      - run: python -m build
      - name: Verify wheel
        run: |
          python -m venv /tmp/release-smoke
          /tmp/release-smoke/bin/pip install dist/*.whl
          /tmp/release-smoke/bin/patchwitness --version
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: "dist/*"
      - name: Upload immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/* --clobber
