name: Release assets

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install --disable-pip-version-check build
      - run: python -m build
      - name: Verify wheel
        run: |
          python -m venv /tmp/release-smoke
          /tmp/release-smoke/bin/pip install dist/*.whl
          /tmp/release-smoke/bin/patchwitness --version
      - name: Upload immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/* --clobber

