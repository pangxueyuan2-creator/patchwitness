name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  attestations: write

jobs:
  verify-and-build:
    name: Verify and build release artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Verify immutable tag matches package version
        shell: bash
        run: |
          version=$(python -c "import runpy; print(runpy.run_path('src/patchwitness/_version.py')['__version__'])")
          test "v${version}" = "${{ github.ref_name }}"
      - name: Install release validation tools
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Run complete quality gate
        run: |
          python -m pytest --cov=patchwitness --cov-report=term-missing --cov-fail-under=80
          ruff check src tests
          mypy src
          python demo/run_demo.py
          python benchmarks/change-risk/run.py
      - name: Build source and wheel distributions
        run: python -m build
      - name: Validate distribution metadata and manifest
        run: |
          twine check dist/*
          tar tzf dist/*.tar.gz | sort | tee /tmp/sdist-manifest.txt
          unzip -l dist/*.whl | tee /tmp/wheel-manifest.txt
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 2
      - name: Clean-install wheel smoke test
        shell: bash
        run: |
          python -m venv /tmp/patchwitness-wheel
          /tmp/patchwitness-wheel/bin/pip install --disable-pip-version-check dist/*.whl
          /tmp/patchwitness-wheel/bin/patchwitness --version
          /tmp/patchwitness-wheel/bin/patchwitness --help >/dev/null
      - name: Write artifact digests
        shell: bash
        run: |
          cd dist
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"
      - name: Upload release distributions for publish job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-distributions
          path: dist/*
          if-no-files-found: error
      - name: Create or update GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --generate-notes --verify-tag
          fi

  publish-pypi:
    name: Publish verified distributions to PyPI
    needs: verify-and-build
    runs-on: ubuntu-latest
    # Set the repository variable only after configuring the PyPI Trusted Publisher
    # for this exact workflow and protecting the pypi environment.
    if: vars.PYPI_TRUSTED_PUBLISHING == 'true'
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download verified release distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-distributions
          path: dist
      - name: Publish verified distributions
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
