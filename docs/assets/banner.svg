<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">PatchWitness</title>
  <desc id="desc">Proof before merge - independent evidence for AI-generated code changes</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0c1f33"/>
      <stop offset="1" stop-color="#10283c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#55e6c1"/>
      <stop offset="1" stop-color="#39a7ff"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#8ac7dd" stroke-opacity=".07"/>
    </pattern>
  </defs>
  <rect width="1280" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="24" fill="url(#grid)"/>
  <circle cx="1130" cy="54" r="210" fill="#39a7ff" opacity=".06"/>
  <circle cx="1060" cy="320" r="180" fill="#55e6c1" opacity=".05"/>

  <g transform="translate(86 78)" filter="url(#glow)">
    <path d="M96 0 180 35v64c0 54-34 91-84 113C46 190 12 153 12 99V35Z" fill="#0c2435" stroke="url(#accent)" stroke-width="7"/>
    <path d="m56 102 27 27 55-65" fill="none" stroke="#55e6c1" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M158 157h45m-23-22 23 22-23 22" fill="none" stroke="#39a7ff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g transform="translate(360 96)" font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="0" y="64" fill="#f4fbff" font-size="68" font-weight="760" letter-spacing="-2">PatchWitness</text>
    <text x="2" y="117" fill="#8fe7d1" font-size="27" font-weight="650" letter-spacing="2.4">PROOF BEFORE MERGE</text>
    <text x="2" y="168" fill="#b8cbd8" font-size="22">Independent evidence for AI-generated code changes.</text>
  </g>
  <g transform="translate(1055 258)" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="15">
    <rect width="151" height="44" rx="22" fill="#55e6c1" opacity=".12" stroke="#55e6c1" stroke-opacity=".45"/>
    <circle cx="25" cy="22" r="6" fill="#55e6c1"/>
    <text x="42" y="27" fill="#baf7e7">GATE: PASS</text>
  </g>
</svg>

